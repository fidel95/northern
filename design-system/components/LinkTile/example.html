<!doctype html>
<html>
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><meta charset="utf-8"><title>Link tile</title>
<style>body{margin:0}.pv{padding:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style>
</head>
<body class="np-root">
<section class="np-photo" data-theme="dark" style="background-image:url('../../images/fog-pines.jpg');padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:12px">
  <img src="../../images/npcs-logo-badge.jpg" alt="Northern Pines Construction Services" width="88" height="88" style="border-radius:999px;display:block">
  <p class="np-display" style="font-size:22px;color:var(--on-pine)">NPCS</p>
  <p style="margin:0 0 8px;text-align:center;max-width:36ch;color:var(--on-pine);font-size:14px;line-height:20px">Roofing, windows, doors, siding and gutters. Free inspections and estimates.</p>
  <div style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px">
    <a class="np-tile" href="#"><span class="np-tile__icon">▲</span><span class="np-tile__label">Custom Windows &amp; Doors</span><span class="np-tile__arrow">→</span></a>
    <a class="np-tile" href="#"><span class="np-tile__icon">✉</span><span class="np-tile__label">Request a free estimate</span><span class="np-tile__arrow">→</span></a>
  </div>
</section>
</body>
</html>
