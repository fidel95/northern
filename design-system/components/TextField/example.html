<!doctype html>
<html>
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><meta charset="utf-8"><title>Text field</title>
<style>body{margin:0}.pv{padding:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style>
</head>
<body class="np-root">
<div style="padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;max-width:720px">
  <label class="np-field"><span class="np-label">Full name</span><input class="np-input" placeholder="Jordan Miller"></label>
  <label class="np-field"><span class="np-label">Phone</span><input class="np-input" value="(765) 376-11"><p class="np-help">We call back within one business day.</p></label>
  <label class="np-field np-field--error"><span class="np-label">Email</span><input class="np-input" value="jordan@" aria-invalid="true"><p class="np-help">Enter a full email address, like name@example.com.</p></label>
  <label class="np-field"><span class="np-label">What do you need? <span class="np-label__opt">(optional)</span></span><textarea class="np-input" placeholder="Two drafty windows on the north side…"></textarea></label>
</div>
</body>
</html>
