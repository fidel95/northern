<!doctype html>
<html>
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><meta charset="utf-8"><title>Project card</title>
<style>body{margin:0}.pv{padding:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style>
</head>
<body class="np-root">
<div class="pv" style="align-items:stretch">
  <a class="np-card" href="#" style="width:300px">
    <div class="np-card__media" style="background-image:url('../../images/fog-pines.jpg')"><span class="np-badge">Windows</span></div>
    <div class="np-card__body">
      <h3 class="np-card__title">Bay window replacement</h3>
      <p class="np-card__meta">Central Indiana · 2 days · our own crew</p>
      <span class="np-card__link">See the before &amp; after →</span>
    </div>
  </a>
  <a class="np-card" href="#" style="width:300px">
    <div class="np-card__media" style="background-color:var(--mist)"><span class="np-badge">Roofing</span></div>
    <div class="np-card__body">
      <h3 class="np-card__title">Full roof tear-off</h3>
      <p class="np-card__meta">Architectural shingles · 3 days</p>
      <span class="np-badge np-badge--success" style="align-self:flex-start"><span class="np-badge__dot"></span>Completed</span>
    </div>
  </a>
</div>
</body>
</html>
